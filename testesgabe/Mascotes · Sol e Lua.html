<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sol e Lua · mascotes do CoupleCare</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfe3ff;--fg:#101c33;--mu:#40527a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c33;--fg:#f4f1ff;--mu:#9fb0d4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101c33;--fg:#f4f1ff;--mu:#9fb0d4;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;text-align:center;transition:background .7s,color .7s}
main{padding:24px}
svg{width:min(92vw,430px);height:auto;overflow:visible;color:var(--fg)}
h1{font-size:1.4rem;font-weight:800;margin:.6rem 0 .3rem}
p{margin:0 auto;color:var(--mu);max-width:34ch;line-height:1.5;min-height:3em}
button{margin-top:1rem;font:inherit;font-weight:800;padding:.7rem 1.3rem;border:0;border-radius:999px;background:var(--fg);color:var(--bg);cursor:pointer}
button:focus-visible{outline:3px solid #ff7a8a;outline-offset:3px}
small{display:block;margin-top:.8rem;color:var(--mu)}
.tb{transform-box:fill-box;transform-origin:center}
.sun,.moon{cursor:pointer;transition:transform .8s cubic-bezier(.3,1.5,.5,1),opacity .6s}
[data-theme="light"] .sun,[data-theme="dark"] .moon{transform:translateY(-8px) scale(1.12)}
[data-theme="dark"] .sun,[data-theme="light"] .moon{transform:translateY(8px) scale(.86);opacity:.88}
.fl{animation:fl 4s ease-in-out infinite}.moon .fl{animation-delay:-2s}
@keyframes fl{50%{transform:translateY(-5px)}}
.rays{animation:spin 24s linear infinite;transform-origin:100px 115px}
@keyframes spin{to{transform:rotate(360deg)}}
.sl,.zs{display:none}
[data-theme="dark"] .sun .op,[data-theme="light"] .moon .op{display:none}
[data-theme="dark"] .sun .sl,[data-theme="light"] .moon .sl,[data-theme="dark"] .sun .zs,[data-theme="light"] .moon .zs{display:block}
.look{transform:translate(var(--lx,0px),var(--ly,0px))}
.eye{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.gs,.gm{transition:opacity .7s}.gs{opacity:.4}.gm{opacity:.06}
[data-theme="dark"] .gs{opacity:.06}[data-theme="dark"] .gm{opacity:.22}
.cl,.sk{transition:opacity .7s}.sk{opacity:0}[data-theme="dark"] .sk{opacity:1}[data-theme="dark"] .cl{opacity:0}
.dr{animation:dr 9s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(16px)}}
.tw{animation:tw 2.6s infinite}@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
.z{animation:z 3s infinite}.z+.z{animation-delay:1.2s}
@keyframes z{0%{opacity:0;transform:translate(0,6px)}40%{opacity:.9}100%{opacity:0;transform:translate(8px,-14px)}}
.hp{opacity:0}.go .hp{animation:pop 1.3s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3) translateY(12px)}30%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1) translateY(-34px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<svg id="s" viewBox="0 0 300 230" role="img" aria-label="Sol e lua, um casal de mascotes">
<g class="cl"><g class="dr"><g transform="translate(40 52)" fill="#fff" opacity=".85"><ellipse rx="24" ry="10"/><ellipse cx="-8" cy="-6" rx="12" ry="9"/><ellipse cx="10" cy="-7" rx="14" ry="10"/></g></g>
<g class="dr" style="animation-delay:-4s"><g transform="translate(262 196) scale(.8)" fill="#fff" opacity=".85"><ellipse rx="24" ry="10"/><ellipse cx="-8" cy="-6" rx="12" ry="9"/><ellipse cx="10" cy="-7" rx="14" ry="10"/></g></g></g>
<g class="sk" fill="#ffe9a8"><g transform="translate(34 40)"><path class="tw tb" d="M0-8Q1-1 8 0Q1 1 0 8Q-1 1-8 0Q-1-1 0-8Z"/></g><g transform="translate(270 36) scale(.8)"><path class="tw tb" style="animation-delay:.9s" d="M0-8Q1-1 8 0Q1 1 0 8Q-1 1-8 0Q-1-1 0-8Z"/></g><g transform="translate(150 22) scale(.7)"><path class="tw tb" style="animation-delay:1.6s" d="M0-8Q1-1 8 0Q1 1 0 8Q-1 1-8 0Q-1-1 0-8Z"/></g><g transform="translate(24 190) scale(.9)"><path class="tw tb" style="animation-delay:.4s" d="M0-8Q1-1 8 0Q1 1 0 8Q-1 1-8 0Q-1-1 0-8Z"/></g></g>

<g class="sun tb" id="sun"><g class="fl"><circle class="gs" cx="100" cy="115" r="76" fill="#ffd96b"/>
<g class="rays" stroke="#ffb020" stroke-width="7" stroke-linecap="round"><path d="M100 61V47"/><path d="M100 61V47" transform="rotate(36 100 115)"/><path d="M100 61V47" transform="rotate(72 100 115)"/><path d="M100 61V47" transform="rotate(108 100 115)"/><path d="M100 61V47" transform="rotate(144 100 115)"/><path d="M100 61V47" transform="rotate(180 100 115)"/><path d="M100 61V47" transform="rotate(216 100 115)"/><path d="M100 61V47" transform="rotate(252 100 115)"/><path d="M100 61V47" transform="rotate(288 100 115)"/><path d="M100 61V47" transform="rotate(324 100 115)"/></g>
<circle cx="100" cy="115" r="45" fill="#ffc94d"/>
<circle cx="80" cy="125" r="7" fill="#ff6f86" opacity=".4"/><circle cx="120" cy="125" r="7" fill="#ff6f86" opacity=".4"/>
<g class="op"><g class="look"><g class="eye tb"><circle cx="88" cy="110" r="5.5" fill="#101c33"/><circle cx="89.8" cy="108" r="1.8" fill="#fff"/></g><g class="eye tb"><circle cx="112" cy="110" r="5.5" fill="#101c33"/><circle cx="113.8" cy="108" r="1.8" fill="#fff"/></g></g><path d="M91 123Q100 134 109 123" stroke="#101c33" stroke-width="3" fill="none" stroke-linecap="round"/></g>
<g class="sl" stroke="#101c33" stroke-width="3" fill="none" stroke-linecap="round"><path d="M82 111Q88 117 94 111"/><path d="M106 111Q112 117 118 111"/><ellipse cx="100" cy="126" rx="3" ry="2.5" fill="#101c33"/></g>
<g class="zs" fill="currentColor" font-weight="800"><text class="z" x="140" y="70" font-size="16">z</text><text class="z" x="150" y="52" font-size="12">z</text></g></g></g>

<g class="moon tb" id="moon"><g class="fl"><circle class="gm" cx="205" cy="115" r="70" fill="#b8c4f0"/>
<mask id="mm"><rect x="150" y="60" width="110" height="110" fill="#fff"/><circle cx="227" cy="99" r="30" fill="#000"/></mask>
<circle cx="205" cy="115" r="42" fill="#e9edff" mask="url(#mm)"/>
<circle cx="176" cy="102" r="3.5" fill="#cdd6f7"/><circle cx="192" cy="150" r="3" fill="#cdd6f7"/>
<g transform="rotate(50 187 127)"><circle cx="177" cy="134" r="4" fill="#ff6f86" opacity=".4"/><circle cx="197" cy="134" r="4" fill="#ff6f86" opacity=".4"/>
<g class="op"><g class="look"><g class="eye tb"><circle cx="180" cy="125" r="4" fill="#101c33"/><circle cx="181.2" cy="123.6" r="1.3" fill="#fff"/></g><g class="eye tb"><circle cx="194" cy="125" r="4" fill="#101c33"/><circle cx="195.2" cy="123.6" r="1.3" fill="#fff"/></g></g><path d="M183 133Q187 138 191 133" stroke="#101c33" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
<g class="sl" stroke="#101c33" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M176 125Q180 129 184 125"/><path d="M190 125Q194 129 198 125"/><ellipse cx="187" cy="135" rx="2.2" ry="2" fill="#101c33"/></g></g>
<g class="zs" fill="currentColor" font-weight="800"><text class="z" x="240" y="76" font-size="16">z</text><text class="z" x="251" y="58" font-size="12">z</text></g></g></g>

<g transform="translate(150 60)"><path class="hp tb" d="M0 9C-15-2-9-15 0-6C9-15 15-2 0 9Z" fill="#ff6f86"/></g>
</svg>
<h1>Sol e lua</h1>
<p id="cap"></p>
<button id="btn" type="button" aria-pressed="false">Trocar dia e noite</button>
<small>Você também pode clicar no sol ou na lua.</small>
</main>
<script>
var r=document.documentElement,s=document.getElementById('s'),cap=document.getElementById('cap'),btn=document.getElementById('btn');
var T={light:'Bom dia! O sol cuida do dia enquanto a lua tira um cochilo.',dark:'Boa noite! A lua assume o céu e o sol vai descansar.'};
function set(m,pop){r.dataset.theme=m;cap.textContent=T[m];btn.setAttribute('aria-pressed',m==='dark');if(pop){s.classList.remove('go');void s.getBoundingClientRect();s.classList.add('go');}}
var mq=matchMedia('(prefers-color-scheme: dark)');
set(mq.matches?'dark':'light');
mq.addEventListener('change',function(e){set(e.matches?'dark':'light',1);});
function tog(){set(r.dataset.theme==='dark'?'light':'dark',1);}
btn.addEventListener('click',tog);
document.getElementById('sun').addEventListener('click',tog);
document.getElementById('moon').addEventListener('click',tog);
addEventListener('pointermove',function(e){var b=s.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5,c=function(v){return Math.max(-2.5,Math.min(2.5,v*8));};s.style.setProperty('--lx',c(x)+'px');s.style.setProperty('--ly',c(y)+'px');});
</script></body></html>
