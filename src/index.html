<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação para exibir acentos corretamente -->
    <meta charset="UTF-8">

    <!-- Adapta o layout para celulares e computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Nome exibido na aba do navegador -->
    <title>CoupleCare</title>

    <!-- Conecta o arquivo CSS responsável pelo visual -->
    <link rel="stylesheet" href="style.css">   
</head>
<body>

<div class="aplicacao">

    <!-- Menu lateral de navegação -->
    <aside class="menu-lateral">
        <div class="menu-lateral-cabecalho">
            <!--Logo do app-->
            <img
                src="../assets/images/couplecare-logo-header.svg"
                alt="CoupleCare"
                class="logo-couplecare">
            <button
                type="button"
                class="botao-menu"
                id="botao-menu"
                aria-label="Recolher menu"
                aria-expanded="true">
                <img
                    src="../assets/images/menu_icon.png"
                    alt=""
                    class="icone-menu">
            </button>
        </div>

        <nav class="navegacao" aria-label="Navegação principal">
            <a href="#" class="item-menu ativo" aria-current="page">
                <svg class="icone-item-menu" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="#" class="item-menu">
        <svg class="icone-item-menu" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="3" width="16" height="18" rx="2"/>
            <path d="m8 12 2.5 2.5L16 9"/>
        </svg>
        <span>Tarefas</span>
    </a>

    <a href="#" class="item-menu">
        <svg class="icone-item-menu" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M16 3v4M8 3v4M3 10h18"/>
        </svg>
        <span>Calendário</span>
    </a>

    <a href="#" class="item-menu">
        <svg class="icone-item-menu" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
        <span>Menstruação</span>
    </a>

    <a href="#" class="item-menu">
        <svg class="icone-item-menu" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="18" height="14" rx="2"/>
            <path d="M3 11h18M7 16h3"/>
        </svg>
        <span>Finanças</span>
    </a>

    <a href="#" class="item-menu">
        <svg class="icone-item-menu" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.7a8 8 0 0 1-1.5.9l-.3 1.8h-3l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.7-1.5-2.6 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.5-2.6 1.7.7a8 8 0 0 1 1.5-.9l.3-1.8h3l.3 1.8a8 8 0 0 1 1.5.9l1.7-.7 1.5 2.6-1.4 1.1a7 7 0 0 1 0 1.7z" transform="translate(-1 -1) scale(1.08)"/>
        </svg>
        <span>Configurações</span>
    </a>

        </nav>
    </aside>

    <!-- Área principal: cabeçalho e conteúdo -->
    <div class="conteudo-principal">

<!-- ########################################################################## -->
    <!-- Cabeçalho principal da aplicação -->
    <header class="cabecalho">
        <h1>Dashboard</h1>
        <p>Cuidando da nossa vida juntos ❤️</p>
    </header>

    <!-- Conteúdo principal da página -->
    <main class="conteudo">
        <section class="boas-vindas">
            <h2>Nosso espaço, nossa vida.</h2>
            <p>Organizem as tarefas e construam uma rotina juntos.</p>
        </section>
    </main>    
    </div>  <!-- Fim de .conteudo-principal -->
</div>      <!-- Fim de .aplicacao -->

    <!-- Carrega o JavaScript depois do HTML -->
    <script src="script.js"></script>    
</body>
</html>
